---
- hosts: localhost
  gather_facts: false
  name: Provision NAS Storage
  collections:
    - netapp.ontap

  module_defaults:
    group/netapp.ontap.netapp_ontap:
      hostname: "{{ netapp_hostname }}"
      username: "{{ netapp_username }}"
      password: "{{ netapp_password }}"
      vserver: "{{ vserver }}"
      https: true
      validate_certs: false
      use_rest: auto
  vars_prompt:
    - name: "netapp_password"
      prompt: "Enter the NetApp Admin Password"
      private: true
      confirm: true
  vars_files:
    - ./nas_vars.yml

  tasks:
    - name: Create Export Policy
      na_ontap_export_policy:
        state: present
        name: "{{ volname }}_policy"

    - name: Set Up Export Policy Rules
      na_ontap_export_policy_rule:
        state: present
        policy_name: "{{ volname }}_policy"
        client_match: "{{ client_match }}"
        ro_rule: sys
        rw_rule: sys
        super_user_security: sys
      when: protocol.lower() == 'nfs'

    - name: Create Volume
      na_ontap_volume:
        state: present
        name: "{{ volname }}"
        aggregate_name: "{{ aggr_name }}"
        size: "{{ size }}"
        size_unit: gb
        policy: "{{ volname }}_policy"
        junction_path: "/{{ volname }}"
        space_guarantee: "none"
        volume_security_style: unix

    - name: Create CIFS Share
      na_ontap_cifs:
        state: present
        share_name: "{{ volname }}"
        path: "/{{ volname }}"
      when: protocol.lower() == 'cifs'