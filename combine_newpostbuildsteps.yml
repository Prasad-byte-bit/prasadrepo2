              shell: cat //var/lib/loginsight-agent/liagent.ini|grep tag|awk -F'=' '{print $2}'|tr '\n' ','
              ignore_errors: True
              register: tag_status
          
            - name: service start liagentd
              systemd:
                name: liagentd
                state: started
                enabled: yes 
              ignore_errors: True
          
            - name: display liagentd status
              debug:
                msg: "{{ liagentd_service_status.stdout }}"
                                      
          
