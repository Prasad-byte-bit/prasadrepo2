        - name: Final Status Message
          debug:
            msg: >-
              {% if script_success %}
               Script completed successfully!
              {% else %}
               Script failed: {{ error_message }}
              {% endif %}

        - name: Define service list
          set_fact:
            service_list:
              - NetworkManager
              - vmtoolsd
              - kdump
              - sendmail
              - nscd
              - qualys-cloud-agent

        - name: Get enabled status of services
          command: "systemctl is-enabled {{ item }}"
          register: service_enabled
