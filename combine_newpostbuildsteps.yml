                insertafter: '; hostname=OPERATIONS_FOR_LOGS'
                line: "hostname={{ hostname_fact }}"
              ignore_errors: true
          
            - name: remove last line if hostname is present
              shell: sed -i '${/hostname=/d}' /var/lib/loginsight-agent/liagent.ini
              ignore_errors: true
          
            - name: Upload service check script
              copy: src=/var/lib/awx/projects/myprojecrserverbuild/rpmfiles/servicechk.sh dest=/etc/servicestatuschk.sh mode=0655
              delegate_to: localhost
              
          
            - name: Get liagentd Service Status
              shell: /etc/servicestatuschk.sh liagentd
