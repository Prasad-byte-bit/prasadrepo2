            # loginsight             #
            ##########################

            - name: Take a backup under root
              shell: cp /etc/liagent.ini /root/liagent.ini
              ignore_errors: true
          
            - name: Take a backup liagent
              shell: cp /var/lib/loginsight-agent/liagent.ini /var/lib/loginsight-agent/liagent.ini_{{ ansible_date_time.date }}_{{ ansible_date_time.time }}_bkp
              ignore_errors: true
              
            - name: Ensure liagent.ini exists
              file:
                path: /var/lib/loginsight-agent
                state: touch
                mode: '0644'
    
            - name: copy config
              copy:
                src: /var/lib/awx/projects/myprojecrserverbuild/rpmfiles/liagent.ini
                dest: /var/lib/loginsight-agent/
              ignore_errors: true
              delegate_to: localhost
          
            - name: File is exist
              stat:
                path: /root/VMware-Log-Insight-Agent-8.18.0-24019905.noarch.rpm
              register: present
          
          
            - name: Copy the file to remote system
              copy:
                src: /var/lib/awx/projects/myprojecrserverbuild/rpmfiles/VMware-Log-Insight-Agent-8.18.0-24019905.noarch.rpm
                dest: /root
                force: no
              delegate_to: localhost
              when: not present.stat.exists
              
          
            - name: Package was already installed
              shell:
                cmd: rpm -q VMware-Log-Insight-Agent
                warn: false
              register: package_installed
              changed_when: package_installed.rc == 1
              ignore_errors: yes
          
            - name: Package installed status
              debug:
                msg: "{{ package_installed.stdout }}"
          
            - name: check the loginsight agent is preset
              stat:
                path: /etc/init.d/liagentd
              register: agent_available
          
            - name: service stop liagentd
              systemd:
                name: liagentd
                state: stopped
                enabled: yes
              ignore_errors: True
          
            - name: remove PKG
              yum:
                name:
                  - VMware-Log-Insight-Agent
                state: absent
              ignore_errors: yes
          
            - name: install pkg
              shell: rpm -ivh /root/VMware-Log-Insight-Agent-8.18.0-24019905.noarch.rpm
              ignore_errors: yes
            
            - name: replace update line
              replace:
                path: /var/lib/loginsight-agent/liagent.ini
                regexp: ';auto_update=yes'
                replace: 'auto_update=yes'
              ignore_errors: true
          
            - name: configure ssl cert config
              lineinfile:
                path: /var/lib/loginsight-agent/liagent.ini
                line: "ssl_accept_any=yes"
                insertafter: ";ssl_fips_mode=1"
                state: present
              register: sslcert
          
            - name: Configure the OS log sending to logininsight
              blockinfile:
                path: /var/lib/loginsight-agent/liagent.ini
                backup: yes
                block: |
          
                  [filelog|audit]
                  directory=/var/log/audit
                  include=audit.log
                  tags={"apptag":"os-auditlogs"}
          
                  [filelog|messages]
                  directory=/var/log
                  include=messages;messages.?
                  parser=syslog_parser
                  tags={"apptag":"os-logs"}
          
                  [filelog|secure]
                  directory=/var/log
                  include=secure;secure.?
                  parser=syslog_parser
                  tags={"apptag":"os-logs"}
          
                  [filelog|maillog]
                  directory=/var/log
                  include=maillog;mail.err;mail.log;mail.log.?
                  parser=mail_parser
                  tags={"apptag":"os-logs"}
          
                  [parser|syslog_parser]
                  base_parser=clf
                  format=%t %i %{appname}i: %M
                  field_decoder={"appname":"syslog_appname_parser"}
                  exclude_fields=log_message
          
                  [parser|syslog_appname_parser]
                  base_parser=clf
                  format=%{appname}i[%{thread_id}i]
          
                  [parser|mail_parser]
                  base_parser=clf
                  format=%t %i %{appname}i[%{thread_id}i]: %M
                  exclude_fields=log_message
          
                  [parser|audit_parser]
                  base_parser=clf
                  format=type=%{type}i msg=%{msg}i %M
                  exclude_fields=log_message
          
                insertbefore: "; Uncomment the appropriate section to collect system logs"
                marker: "; {mark} ANSIBLE MANAGED BLOCK"
              when: sslcert != 6 
    
          
          
            - name: find the string hostname
              lineinfile:
                path: /var/lib/loginsight-agent/liagent.ini
                line: "hostname={{ hostname_fact }}"
                state: present
              register: result
          
            - name: Debug the result
              debug:
                msg: "String exists in the file: {{ result }}"
          
            - name: Server name hostname=endpointname added
              lineinfile:
                path: /var/lib/loginsight-agent/liagent.ini
