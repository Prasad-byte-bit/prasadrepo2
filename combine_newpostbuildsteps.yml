        - name: setfact for command1
          set_fact:
            fact_command1: "{{ command1.stdout }}"
    
    
        - name: setfact for command2
          set_fact:
            fact_command2: "{{ command2.stdout }}"
  

        - name: Gather system info facts
          set_fact:
            summary_info:
              hostname: "{{  ansible_fqdn | default(ansible_hostname) }}"
              ip: "{{ ansible_default_ipv4.address | default('N/A') }}"
              os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
              kernel: "{{ ansible_kernel }}"
              datetime: "{{ ansible_date_time.iso8601 }}"
              cpus: "{{ ansible_processor_cores }}"
              physical_cpus: "{{ ansible_processor_count }}"
              memory_gb: "{{ lookup('pipe', \"free -h | awk '/^Mem:/ {print $2}'\") }}"
              etc_hosts: "{{ hosts_content.stdout.split('\n') | last }}"
              liagent: "{{ liagentd_service_status.stdout }}"
              nproc: "{{ lookup('pipe', 'nproc') | int }}"
              Symentic: "{{ fact_command1 }}"
              DCS: "{{ fact_command2 }}"
              uptime: "{{ uptime_days }}"
              nimbus_status: "{{ service_runningnim }}"

        - name: Create readable summary file on remote
          copy:
            dest: /tmp/system_summary.csv
            mode: '0644'
            content: |
              TASK,STATUS
              Set IP,{{ summary_info.ip }}
              Hostname,{{ summary_info.hostname }}
              CPU Cores,{{ summary_info.nproc }}
              Memory,{{ summary_info.memory_gb }}
              OS,{{ summary_info.os }}
              Kernel,{{ summary_info.kernel }}
              DateTime,{{ summary_info.datetime }}
              Uptime,{{ summary_info.uptime }}
              Hosts,"{{ summary_info.etc_hosts }}"
              Liagent,{{ summary_info.liagent }}
              Symantec,{{ summary_info.Symentic }}
              DCS,{{ summary_info.DCS }}
              Nimbus,{{ summary_info.nimbus_status }}
        
              {% for svc, en, ac in service_list
                   | zip(service_enabled.results, service_active.results) %}
              {{ svc }},{{ en.stdout | default('unknown') }} ({{ ac.stdout | default('unknown') }})
              {% endfor %}
        
              CE Name Hosting,unix
              Cryptographic Settings,COM


        - name: Fetch system summary CSV to local machine
          fetch:
            src: /tmp/system_summary.csv
            #dest: /home/workatansi/prasad/
            dest: /var/lib/awx/projects/myprojecrserverbuild/reportsserverbuild/
            flat: yes

        #- name: Send system summary with attachment (remote host)
          #shell: |
            #echo "System summary report for {{ server_name }} attached." | \
            #mailx -s "System Summary Report - {{ server_name }}" \
            #-a /tmp/system_summary.csv "{{ test_email }}"
          #ignore_errors: yes


        - name: Send Server build Report email
          mail:
            host: "relay.smtp.broadcom.com"
            port: 25
            subject: "server_build_report"
            body: |
              Hi Team,
    
              Please find the server build report for the server {{ server_name }}.
             
    
              Regards,
              Automation Team
            from: "siddareddygari-sp.prasad@broadcom.com"
            #to: "siddareddygari-sp.prasad@broadcom.com"
            to:
              - "siddareddygari-sp.prasad@broadcom.com"
              #- "binayabhusan.mohapatra@broadcom.com"

            subtype: plain
            charset: utf8
            attach:
              - "/var/lib/awx/projects/myprojecrserverbuild/reportsserverbuild/system_summary.csv"
          delegate_to: localhost
          run_once: true



        - name: Print Final Summary to Console
          debug:
            msg: |
              =========  SYSTEM SUMMARY =========
              Hostname       : {{ summary_info.hostname }}
              IP Address     : {{ summary_info.ip }}
              OS Name        : {{ summary_info.os }}
              Kernel Version : {{ summary_info.kernel }}
              Date & Time    : {{ summary_info.datetime }}
              CPU Cores      : {{ summary_info.cpus }} ({{ summary_info.physical_cpus }} physical)
              Total Memory   : {{ summary_info.memory_gb }} GB

              =========  /etc/hosts =========
              {{ hosts_content.stdout }}

              ========= 🔧 SERVICE STATUSES =========
              {% for i in range(service_list | length) %}
              {{ service_list[i] }} => Enabled: {{ service_enabled.results[i].stdout | default('unknown') }},
              Active: {{ service_active.results[i].stdout | default('unknown') }}
              {% endfor %}
              
        - name: Update webhook for success
          include_tasks:
            file: ../../webhook_postbuild.yml
          when: script_success
          vars:
            Sr_Number: "{{ SR_ID }}"
            task_id: "{{ Task_id }}"
            execution_status: "Success"
            execution_output: "Script executed successfully."
