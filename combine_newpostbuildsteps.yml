---
- name: Prepare dynamic host
  hosts: localhost
  gather_facts: no

  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  
  vars_files:
    - vars/system_config.yml

  tasks:
    - name: Decide corporate or dmz
      set_fact:
        cor_dmz: "{{ 'corporate' if target_host.startswith('10') else 'dmz' }}"

    - debug:
        var: cor_dmz

    # ---------------------------------------------------
    #  Prod / Nonprod
    # ---------------------------------------------------
    - name: Decide prod or nonprod
      set_fact:
        prod_nonprod: "{{ 'nonprod' if vm_name.startswith('lnpv') else 'prod' }}"

    - debug:
        var: prod_nonprod

    # ---------------------------------------------------
    #  Subname detection
    # ---------------------------------------------------
    - name: Identify subname
      set_fact:
        subname: >-
          {{
            ['acc','sgn','lvn','erp','ibn','tky','ams','png','sha']
            | select('in', vm_name | lower)
            | list
            | first
          }}

    - debug:
        var: subname

    # ---------------------------------------------------
    #  Read host.ini
    # ---------------------------------------------------
    - name: Read host.ini using full path
      set_fact:
        host_lines: "{{ lookup('file', '/var/lib/awx/projects/myprojecrserverbuild/rpmfiles/host.ini').splitlines() }}"

    # ---------------------------------------------------
    #  Select hostname (ALL RULES)
    # ---------------------------------------------------
    - name: Select final hostname
      set_fact:
        hostname_fact: >-
          {{
            (
              host_lines
              | select('search', '^' ~ subname)
              | select('search',
                  ('c' if cor_dmz == 'corporate' else 'd') ~
                  ('prod' if prod_nonprod == 'prod' else 'nprd')
                )
              | list
              | first
            )
            if subname in ['acc','sgn'] else
            (
              host_lines
              | select('search', '^lvn')
              | select('search',
                  'cprod' if cor_dmz == 'corporate' else
                  ('dprod' if prod_nonprod == 'prod' else 'dnprd')
                )
              | list
              | first
            )
            if subname == 'lvn' else
            (
              host_lines
              | select('search', '^' ~ subname)
              | list
              | first
            )
          }}

    - name: Select final hostname
      set_fact:
        hostname_fac: "{{ hostname_fact | default('') }}"




    # ---------------------------------------------------
    #  Safety check (recommended)
    # ---------------------------------------------------
    - name: Fail if hostname not resolved
      fail:
        msg: >
          No hostname matched.
          vm_name={{ vm_name }},
          cor_dmz={{ cor_dmz }},
          prod_nonprod={{ prod_nonprod }}
      when: hostname_fact is not defined or hostname_fact | length == 0
    - name: Add target host dynamically
      add_host:
    
        name: "{{ target_host }}"
        groups: "dynhosts"
        ansible_user: "autoadmin"
        ansible_ssh_pass: "{{ Password }}"
  
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        script_success: true
        error_message: ""
        ansible_host: "{{ target_host }}"
        hostname: "{{ vm_name }}"
        server_name: "{{ vm_name }}"
        test_email: "{{ test_email }}"
        telnet_host: "{{ vm_name }}"
        servername: "{{ vm_name }}"
        hostname_fact: "{{ hostname_fac }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"



- name: Connect to Linux server dynamically
  hosts: dynhosts
  gather_facts: yes
  become: yes
  #become_user: root

  vars_files:
    - vars/system_config.yml

  tasks:
    
    - block:
        - name: Initialize script_failed flag
          set_fact:
            script_failed: false
        ######################################
        #         ORIGINAL SCRIPT            #
        ######################################

        - name: Validate OS type
          set_fact:
            os_distro: "{{ ansible_distribution | lower }}"
        - fail:
            msg: "Unsupported OS: {{ ansible_distribution }}"
          when: os_distro not in ['redhat', 'oraclelinux', 'rocky']
        ###############################################
        #          CHANGES IN HOSTS AND HOSTNAME FILE #
        ###############################################
        - name: Reset /etc/hosts with default localhost entries
          copy:
            dest: /etc/hosts
            content: |
              127.0.0.1   localhost localhost.localdomain localhost4 localhost4.localdomain4
              ::1         localhost localhost.localdomain localhost6 localhost6.localdomain6
            owner: root
            group: root
            mode: '0644'

        - name: Add entry to /etc/hosts (IP FQDN SHORTNAME)
          lineinfile:
            path: /etc/hosts
            line: "{{ target_host }} {{ vm_name }} {{ vm_name.split('.')[0] }}"
            state: present
        - name: Set FQDN in /etc/server_name
          lineinfile:
            path: /etc/hostname
            line: "{{ vm_name }}"
            state: present

        ######################################
        #          CHECKING network-manager  #
        ######################################
        - name: Check & Install NetworkManager
          block:
            - name: Check NetworkManager (RedHat)
              command: rpm -q NetworkManager
              register: nm_check
              ignore_errors: yes

        - name: Enable & start NetworkManager
          systemd:
            name: NetworkManager
            state: started
            enabled: yes
          register: task_out

        - name: Print file status
          debug:
            msg: "File exists: {{ task_out }}"

        ######################################
        #          CHECKING vmtools_check    #
        ######################################
        - name: Install open-vm-tools if needed
          block:
            - command: rpm -q open-vm-tools
              register: vmtools_check
              ignore_errors: yes
              changed_when: false

            - systemd:
                name: vmtoolsd
                enabled: yes
                state: started
              register: task_output
              
            - name: Print file status
              debug:
                msg: "File exists: {{ task_output }}"

        ######################################
        #          kdump_check               #
        ######################################
        - name: Install kexec-tools if needed
          block:
            - command: rpm -q kexec-tools
              register: kdump_check
              ignore_errors: yes
              changed_when: false

            - systemd:
                name: kdump
                enabled: yes
                state: started
              register: outputt

            - name: Print file status
              debug:
                msg: "File exists: {{ outputt }}"

        ######################################
        #         Sendmail CONFIGARATION     #
        ######################################
        - name: Sendmail setup
          block:
            - name: Check if Sendmail is installed
              shell: rpm -q sendmail
              register: sendmail_check
              ignore_errors: yes
              changed_when: false

            - name: Check if Postfix is installed
              shell: rpm -q postfix
              register: postfix_check
              ignore_errors: yes
              changed_when: false

            - name: Determine if packages need to be installed
              set_fact:
                install_packages: "{{ (sendmail_check.rc != 0) and (postfix_check.rc != 0) }}"

            - name: Install required packages if not present
              yum:
                name:
                  - sendmail
                  - sendmail-cf
                  - m4
                  - mailx
                state: present
              when: install_packages

            - name: Backup existing sendmail.mc and sendmail.cf
              copy:
                src: "/etc/mail/{{ item }}"
                dest: "/etc/mail/{{ item }}.bakk1"
                remote_src: yes
              with_items:
                - sendmail.mc
                - sendmail.cf
              ignore_errors: yes

            - name: Overwrite sendmail.mc with full static configuration
              copy:
                dest: /etc/mail/sendmail.mc
                content: |
                  define(`_USE_ETC_MAIL_')dnl
                  dnl #
                  include(`/usr/share/sendmail-cf/m4/cf.m4')dnl
                  dnl #
                  OSTYPE(`linux')dnl
                  dnl #
                  dnl # Defines
                  dnl #
                  dnl #
                  dnl # Macros
                  dnl #
                  DAEMON_OPTIONS(`Name=MTA-v4, Family=inet, Port=smtp')dnl
                  DAEMON_OPTIONS(`Name=MTA-v6, Family=inet6, Port=smtp, M=O')dnl
                  dnl #
                  FEATURE(nocanonify)
                  dnl # Mailer
                  dnl #
                  MAILER(`smtp')dnl
                  MAILER(`local')dnl
                  define(`SMART_HOST', `relay.smtp.broadcom.com')dnl
                  define(`confMAX_DAEMON_CHILDREN', `500')dnl
                  define(`confPRIVACY_FLAGS', `authwarnings,novrfy,noexpn,restrictqrun')dnl
                owner: root
                group: root
                mode: '0644'

            - name: Rebuild sendmail.cf from sendmail.mc
              shell: m4 /etc/mail/sendmail.mc > /etc/mail/sendmail.cf

            - name: Restart sendmail service
              service:
                name: sendmail
                state: restarted
                enabled: true

            - name: Install mailx
              yum:
                name: mailx
                state: present
              ignore_errors: yes
            
            - name: Restart sendmail service
              service:
                name: sendmail
                state: restarted
                enabled: true
              ignore_errors: yes
            
            - name: Send test mail to validate configuration
              shell: |
                echo "Testmail from {{ server_name }}" | mailx -s "Sendmail Config Test" "{{ test_email }}"
              register: mail_status
              ignore_errors: yes


            #- name: Send test mail to validate configuration
              #shell: echo "Testmail from {{ server_name }}" | mailx -s "Sendmail Config Test" "{{ test_email }}"
              #ignore_errors: yes
   
        ######################################
        #          SNOWAGENT                 #
        ######################################
        - name: RPM/DEB download and verification
          block:

            - name: Copy RPM from local controller to remote server
              become: yes
              copy:
                src: /var/lib/awx/projects/myprojecrserverbuild/rpmfiles/Linux_2_8_2024-snowagent-7.0.0-x64.rpm
                dest: /var/tmp/Linux_2_8_2024-snowagent-7.0.0-x64.rpm
                mode: '0644'
              when: ansible_facts['distribution'] != "Ubuntu"
              
            - name: Copy RPM from local controller to remote server
              become: yes
              copy:
                src: /var/lib/awx/projects/myprojecrserverbuild/rpmfiles/Linux_2_8_2024-snowagent-7.0.0-x64.deb
                dest: /var/tmp/Linux_2_8_2024-snowagent-7.0.0-x64.rpm
                mode: '0644'
              when: ansible_facts['distribution'] == "Ubuntu"
    
            - name: Capture installed snowagent RPM (RHEL)
              ansible.builtin.shell: rpm -qa | grep snowagent
              register: snowrpm
              ignore_errors: true
              when: ansible_facts['distribution'] != "Ubuntu"
    
            - name: Capture installed snowagent DEB (Ubuntu)
              ansible.builtin.shell: dpkg -l | grep snowagent
              register: snowrpm1
              ignore_errors: true
              when: ansible_facts['distribution'] == "Ubuntu"
    
            - name: Show current SnowAgent version (RHEL)
              debug:
                var: snowrpm.stdout_lines
              when: snowrpm is succeeded
    
            - name: Show current SnowAgent version (Ubuntu)
              debug:
                var: snowrpm1.stdout_lines
              when: snowrpm1 is succeeded
    
    
            - name: Remove snowagent if present(Rhel)
              yum:
                name: snowagent
                state: absent
              when:
                - ansible_facts['distribution'] != "Ubuntu"
                - snowrpm is succeeded
    
    
            - name: Remove snowagent if present(ubantu)
              yum:
                name: snowagent
                state: absent
              when:
                - ansible_facts['distribution'] == "Ubuntu"
                - snowrpm is succeeded
    
            - name: Install new SnowAgent RPM
              become: yes
              dnf:
                name: /var/tmp/Linux_2_8_2024-snowagent-7.0.0-x64.rpm
                state: present
                disable_gpg_check: true
              when:
                - ansible_facts['distribution'] != "Ubuntu"
    
            - name: Install new SnowAgent DEB
              become: yes
              dnf:
                name: /var/tmp/Linux_2_8_2024-snowagent-7.0.0-x64.deb
                state: present
                disable_gpg_check: true
              when:
                - ansible_facts['distribution'] == "Ubuntu"
    
              
            - name: Telnet test (port {{ telnet_port }} on {{ telnet_host }})
              shell: "timeout 5 bash -c '</dev/tcp/{{ telnet_host }}/{{ telnet_port }}' && echo 'Telnet success' || echo 'Telnet failed'"
              register: telnet_result
              changed_when: false
    
            - name: SSL connectivity test (port {{ telnet_port }} on {{ telnet_host }})
              shell: "echo | openssl s_client -connect {{ telnet_host }}:{{ telnet_port }} -servername {{ telnet_host }} 2>/dev/null | grep -i 'connected' || echo 'SSL failed'"
              register: ssl_result
              changed_when: false
              
            - name: Run SnowAgent scan
              ansible.builtin.shell: /opt/snow/snowagent scan
    
    
            - name: Re-check installed snowagent RPM
              ansible.builtin.shell: rpm -qa | grep snowagent
              register: snowrpm
              ignore_errors: true
              when: ansible_facts['distribution'] != "Ubuntu"
    
            - name: Re-check installed snowagent DEB
              ansible.builtin.shell: dpkg -l | grep snowagent
              register: snowrpm1
              ignore_errors: true
              when: ansible_facts['distribution'] == "Ubuntu"
    
            - name: Show final SnowAgent version (RHEL)
              debug:
                var: snowrpm.stdout_lines
              when: snowrpm is succeeded
    
            - name: Show final SnowAgent version (Ubuntu)
              debug:
                var: snowrpm1.stdout_lines
              when: snowrpm1 is succeeded
          

        ######################################
        #        SEP/DCS INSTALLATION        #
        ######################################
        - name: SEP/DCS
          block:
            - name: Copying the installer for os-8
              copy: src="{{ installer_path }}/SEP_14.3RU8_EnterpriseServers_Linux_OnlineInstaller" dest=/root/SEP_14.3RU8_EnterpriseServers_Linux_OnlineInstaller mode=0655 owner=root group=root
              when:
                - ansible_distribution_major_version == "8"
              #delegate_to: localhost
              ignore_errors: true
                      
            - name: Copying the installer for os-9
              copy: src="{{ installer_path }}/SEP_14.3RU9_EnterpriseServers_Linux_OnlineInstaller" dest=/root/SEP_14.3RU9_EnterpriseServers_Linux_OnlineInstaller mode=0655 owner=root group=root
              when:
                - ansible_distribution_major_version == "9"
              #delegate_to: localhost
              ignore_errors: true
        
            - name: installing sep for os-8
              shell: /root/SEP_14.3RU8_EnterpriseServers_Linux_OnlineInstaller
              when:
                - ansible_distribution_major_version == "8"
              register: instout8
        
            - name: installing sep for os-9
              shell: /root/SEP_14.3RU9_EnterpriseServers_Linux_OnlineInstaller
              when:
                - ansible_distribution_major_version == "9"
              register: instout9
              ignore_errors: true
        
            - name: creating DCS config dir
              shell: mkdir -p /opt/DCS_Agent_Installer
        
        
            - name: Copying the agnet binary for os-8
              copy: src="{{ installer_path }}/agent64-linux-rhel8-9537.bin" dest=/opt/DCS_Agent_Installer mode=0655
              when:
                - ansible_distribution_major_version == "8"
              delegate_to: localhost
              ignore_errors: true
                
            - name: Copying the agent certificate for os-8
              copy: src="{{ installer_path }}/agent-cert.ssl" dest=/opt/DCS_Agent_Installer mode=0640
              when:
                - ansible_distribution_major_version == "8"
              delegate_to: localhost
              ignore_errors: true
        
            - name: Copying the agnet binary for os-9
              copy: src="{{ installer_path }}/agent64-linux-rhel9-9537.bin" dest=/opt/DCS_Agent_Installer mode=0655
              when:
                - ansible_distribution_major_version == "9"
              delegate_to: localhost
              ignore_errors: true
              
                
            - name: Copying the agent certificate for os-9
              copy: src="{{ installer_path }}/agent-cert.ssl" dest=/opt/DCS_Agent_Installer mode=0640
              when:
                - ansible_distribution_major_version == "9"
              delegate_to: localhost
              ignore_errors: true
                
            - name: insatlling symentic DCS for os-8
              shell: "{{ install_dir }}/agent64-linux-rhel8-9537.bin -server=10.97.216.137 -secGrp=BRCM_Enterprise_Unix -cert=/opt/DCS_Agent_Installer/agent-cert.ssl -disableIps -silent"
              when:
                - ansible_distribution_major_version == "8"
              ignore_errors: True
        
            - name: insatlling symentic DCS for os-9
              shell: "{{ install_dir }}/agent64-linux-rhel9-9537.bin -server=10.97.216.137 -secGrp=BRCM_Enterprise_Unix -cert=/opt/DCS_Agent_Installer/agent-cert.ssl -disableIps -silent"
              when:
                - ansible_distribution_major_version == "9"
              ignore_errors: True
        
        
            - name: cheking symentic service status 
              shell: /usr/lib/symantec/status.sh
              ignore_errors: True
              
              
            - name: Changing config for sdcssagent using sisipsconfig.sh
              shell: su - sisips -c '/opt/Symantec/sdcssagent/IPS/sisipsconfig.sh -h 10.97.216.137,10.97.216.136'
              ignore_errors: True
          
            - name: restart service to take it effect
              shell: /etc/init.d/sisipsagent restart
              ignore_errors: True
          
            - name: Capture output for command1
              shell: su - sisips -c '/opt/Symantec/sdcssagent/IPS/sisipsconfig.sh -v' |grep "Server Host List"
              register: command1
              ignore_errors: True
          
            - name: Capture output for command2
              shell: su - sisips -c '/opt/Symantec/sdcssagent/IPS/sisipsconfig.sh -v' |grep "Current Management Server"
              register: command2
              ignore_errors: True
          
            - name: display command1
              debug:
                msg: "{{ command1.stdout }}"
          
            - name: display command2
              debug:
                msg: "{{ command2.stdout }}"
          
            - name: setfact for command1
              set_fact:
                fact_command1: "{{ command1.stdout }}"
        
        
            - name: setfact for command2
              set_fact:
                fact_command2: "{{ command2.stdout }}"

        ######################################
        #          NSCD INSTALLATION         #
        ######################################

        - name: NSCD configuration block
          block:

            - name: Install nscd package
              yum:
                name: "{{ nscd_package }}"
                state: present

            - name: Backup nscd.conf
              copy:
                src: "{{ nscd_conf_path }}"
                dest: "{{ nscd_conf_backup }}"
                remote_src: yes

            - name: Replace 'yes' with 'no'
              replace:
                path: "{{ nscd_conf_path }}"
                regexp: 'yes'
                replace: 'no'

            - name: Replace 'no' with 'yes' on hosts line
              replace:
                path: "{{ nscd_conf_path }}"
                regexp: '^(hosts.*)no'
                replace: '\1yes'

            - name: Enable and start nscd service
              systemd:
                name: "{{ nscd_service }}"
                enabled: yes
                state: started

            - name: Backup nsswitch.conf
              copy:
                src: "{{ nsswitch_conf_path }}"
                dest: "{{ nsswitch_conf_backup }}"
                remote_src: yes

            - name: Update hosts line in nsswitch.conf
              lineinfile:
                path: "{{ nsswitch_conf_path }}"
                regexp: '^hosts:.*cache'
                line: "{{ nsswitch_hosts_line }}"

            - name: Run nscd -g and capture output
              command: nscd -g
              register: nscd_g_output
              changed_when: false

            - name: Extract cache hit rate
              set_fact:
                hosts_hit_rate: "{{ (nscd_g_output.stdout | regex_search('hosts:\\s*([0-9]+)%', '\\1') | int) }}"
              when: nscd_g_output.stdout is defined

            - name: Show NSCD cache hit rate and status
              debug:
                msg: >-
                  NSCD hosts cache hit rate: {{ hosts_hit_rate | default('unknown') }}% |
                  {% if (hosts_hit_rate | int) > 1 %}
                    Cache is running
                  {% else %}
                    Cache is not running
                  {% endif %}
        ######################################
        #   QUALYS CLOUD AGENT INSTALLATION  #
        ######################################
        - name: Install and activate Qualys Cloud Agent
          block:

            - name: Copy QualysCloudAgent_Latest.rpm to target host
              copy:
                src: "/var/lib/awx/projects/myprojecrserverbuild/rpmfiles/QualysCloudAgent_Latest.rpm"
                dest: "/root/QualysCloudAgent_Latest.rpm"
                mode: '0644'
              register: copy_result
        
              
            - name: Check if QualysCloudAgent_Latest.rpm already exists on target
              stat:
                path: "/root/QualysCloudAgent_Latest.rpm"
              register: rpm_file_stat
            
            - name: Copy QualysCloudAgent_Latest.rpm to target host if not exists
              copy:
                src: "/var/lib/awx/projects/myprojecrserverbuild/rpmfiles/QualysCloudAgent_Latest.rpm"
                dest: "/root/QualysCloudAgent_Latest.rpm"
                mode: '0644'
              when: not rpm_file_stat.stat.exists
              register: copy_result

            - name: Install Qualys Cloud Agent RPM
              shell: rpm -ivh "/root/QualysCloudAgent_Latest.rpm"
              register: install_output
              failed_when: "'error' in (install_output.stderr | default('')).lower()"

            - name: Show installation output
              debug:
                var: install_output.stdout_lines

            - name: Run Qualys agent activation script
              shell: >
                {{ qualys_bin_path }}
                ActivationId={{ activation_id }}
                CustomerId={{ customer_id }}
              register: activation_output
              failed_when: "'error' in (activation_output.stderr | default('')).lower()"

            - name: Show activation output
              debug:
                var: activation_output.stdout_lines

            - name: Check Qualys agent service status
              shell: systemctl status qualys-cloud-agent
              register: service_status
              failed_when: "'Active: active (running)' not in (service_status.stdout | default(''))"

            - name: Show service status output
              debug:
                var: service_status.stdout_lines
            ######################################
            #   NIMSOFT                          #
            ######################################

            - name: get domain name
              shell: /bin/echo "{{ vm_name }}" |/usr/bin/awk '{split($0, array, "."); print array[2]}'
              register: dnsname
          
            - name: Set facts
              set_fact:
                dnsname_fact:  "{{ dnsname.stdout }}"
          
            - name: display domain name
              debug:
                msg: "{{ dnsname.stdout }}"
          
            - name: copy nimsoft rpm file
              copy: src="{{ nimsoftpath }}/nimsoft-robot.x86_64_23_4_2.rpm" dest=/opt/nimsoft-robot.x86_64_23_4_2.rpm mode=0644
          
            - name: Check if the service exists
              shell: systemctl list-units --type=service --all | grep -w {{ service_name }}
              register: service_check
              ignore_errors: true
          
            - name: Stop the service if it exists
              service:
                 name: "{{ service_name }}"
                 state: stopped
              when: service_check.rc == 0
          
            - name: Check if the nimsoft directory exists
              stat:
                path: "/opt/nimsoft/"
              register: nimsoft_stat
              ignore_errors: True
          
            # Task for remove contains of directory
            - name: remove yum.repos.d dir contents
              file:
                state: absent
                path: /opt/nimsoft/
              when: nimsoft_stat.stat.exists
          
            - name: Check if the nimsoft nms config file is exists
              stat:
                path: "/opt/nms-robot-vars.cfg"
              register: nimsoft_nms_stat
              ignore_errors: True
          
            # Task for remove contains of directory
            - name: remove yum.repos.d dir contents
              file:
                state: absent
                path: /opt/nms-robot-vars.cfg
              when: nimsoft_nms_stat.stat.exists
          
            - name: remove nimsoft old version
              shell: rpm -e nimsoft-robot
              ignore_errors: True
          
            - name: install new nimsoft rpm
              shell: rpm -ivh /opt/nimsoft-robot.x86_64_23_4_2.rpm
              register: inst_nimsoft
          
            - name: display installation
              debug:
                msg: "{{ inst_nimsoft.stdout }}"
          
            - name: Copy robot config from jinja template
              template:
                src: "{{ nimsoftpath }}/nimsoft-robot.j2"
                dest: /opt/nimsoft/robot/robot.cfg
                mode: '0600'
          
            - name: Copy nms config from jinja template
              template:
                src: "{{ nimsoftpath }}/nms-robot-vars.j2"
                dest: /opt/nms-robot-vars.cfg
                mode: '0640'
          
            - name: start the script
              shell: sh /opt/nimsoft/install/RobotConfigurer.sh
              register: script_out
          
            - name: display script out
              debug:
                msg: "{{ script_out.stdout }}"
          
          
            - name: service reload
              service:
                daemon_reload: true
          
            - name: start nimbus service
              service:
                name: nimbus
                state: started
                enabled: true

#####################################
            - name: Check if the service exists
              shell: systemctl list-units --type=service --all | grep -w {{ service_name }}
              register: service_check
              ignore_errors: true
            
            - name: Set service status facts
              set_fact:
                service_existsnim: "{{ service_check.rc == 0 }}"
                service_activenim: >-
                  {{ service_check.rc == 0 and service_check.stdout_lines[0].split()[2] == 'active' }}
                service_runningnim: >-
